<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- subtle grid texture -->
  <g opacity="0.05">
    <line x1="0" y1="68" x2="512" y2="68" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="136" x2="512" y2="136" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="204" x2="512" y2="204" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="272" x2="512" y2="272" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="340" x2="512" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="408" x2="512" y2="408" stroke="#ffffff" stroke-width="1"/>
    <line x1="68" y1="0" x2="68" y2="512" stroke="#ffffff" stroke-width="1"/>
    <line x1="136" y1="0" x2="136" y2="512" stroke="#ffffff" stroke-width="1"/>
    <line x1="204" y1="0" x2="204" y2="512" stroke="#ffffff" stroke-width="1"/>
    <line x1="272" y1="0" x2="272" y2="512" stroke="#ffffff" stroke-width="1"/>
    <line x1="340" y1="0" x2="340" y2="512" stroke="#ffffff" stroke-width="1"/>
    <line x1="408" y1="0" x2="408" y2="512" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- left bracket < -->
  <path d="M178 186 L122 256 L178 326" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- letter R (center) -->
  <text x="256" y="310" font-family="'Courier New', Courier, monospace" font-size="200" font-weight="700" fill="#f0f6ff" text-anchor="middle" opacity="0.95">R</text>

  <!-- right bracket > -->
  <path d="M334 186 L390 256 L334 326" fill="none" stroke="#818cf8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
